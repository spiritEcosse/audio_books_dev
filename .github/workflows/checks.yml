name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # macOS only: the app ships for macOS (bundled Upscayl binary, tools found through a login shell).
  app:
    name: Frontend and Rust
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      # Must run before cargo: Tauri embeds dist/ at compile time.
      - run: pnpm build
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri

  # A newly published advisory can turn this red without any change in the code.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: pnpm audit --audit-level=high
      - run: cargo audit
        working-directory: src-tauri
