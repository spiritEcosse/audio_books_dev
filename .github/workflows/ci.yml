name: CI

on:
  pull_request:
    branches: [main]
  # Also on main, so that pull requests can reuse its Rust cache.
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      # Must run before cargo: Tauri embeds dist/ at compile time.
      - run: pnpm build
      - run: cargo test --locked
        working-directory: src-tauri
